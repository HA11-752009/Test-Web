<!DOCTYPE html>
<html lang="ar" dir="rtl">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شات | Chat</title>
<style>

@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--me:#2a8a72;--them:#232e29;--themT:#e8efec;--line:#2d3a35;--ink:#e8efec;--mute:#8a9892}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-size:20px;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
.screen{display:none;height:100%}
.screen.on{display:flex}
#login{align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.box h1{margin:0 0 4px;font-size:30px}
.box p{margin:0;color:var(--mute);font-size:17px}
input,button{font:inherit}
input[type=text]{font-size:20px;padding:14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);width:100%}
.langs{display:flex;gap:8px}
.langs label{flex:1;text-align:center;font-size:20px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.langs input{display:none}
.langs input:checked+span{font-weight:700}
.langs label:has(input:checked){background:var(--me);color:#fff;border-color:var(--me)}
.btn{font-size:20px;padding:15px;border:0;border-radius:12px;background:var(--me);color:#fff;font-weight:700;cursor:pointer}
#chat{flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:20px}
header small{color:var(--mute);display:block;font-size:16px;margin-top:2px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;background:#9aa5a0}
.dot.on{background:#3cc15a}
header button{font-size:16px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;font-size:22px;line-height:1.5;padding:10px 14px;border-radius:16px;background:var(--them);color:var(--themT);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap;position:relative}
.m.me{align-self:flex-end;background:var(--me);color:var(--meT);border-color:var(--me)}
.m .who{font-size:15px;opacity:.7;margin-bottom:2px}
.m .orig{font-size:16px;opacity:.65;margin-top:4px;border-top:1px dashed currentColor;padding-top:4px}
.m.st{background:none;border:0;font-size:80px;line-height:1.1;padding:0}
.m.st .who{font-size:15px}
.m.st img{width:150px;height:150px;display:block}
.chips{width:100%;display:flex;gap:6px;justify-content:center;padding:2px 0 6px;position:sticky;top:-6px;background:var(--card)}
.chips button{font-size:22px!important;border:1px solid var(--line)!important;border-radius:16px!important;padding:2px 10px!important}
.chips button.on{background:var(--me)!important}
.credit{font-size:12px;color:var(--mute)}
.q{font-size:16px;border-inline-start:3px solid var(--acc);padding:2px 8px;margin-bottom:5px;opacity:.85;background:rgba(0,0,0,.08);border-radius:6px}
.rp{position:absolute;top:2px;inset-inline-end:-30px;opacity:0;border:0;background:none;font-size:16px;cursor:pointer;color:var(--mute)}
.m:hover .rp{opacity:1}
.m.me .rp{inset-inline-end:auto;inset-inline-start:-30px}
@media (hover:none){.rp{opacity:.5;font-size:14px}}
#replyBar{display:none;padding:8px 14px;background:var(--card);border-top:1px solid var(--line);font-size:17px;justify-content:space-between;gap:8px}
#replyBar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyBar button{border:0;background:none;color:var(--ink);font-size:18px;cursor:pointer}
#stk{display:none;flex-direction:column;background:var(--card);border-top:1px solid var(--line);height:250px}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;font-size:24px;background:none;border:0;padding:8px 0;cursor:pointer;border-bottom:3px solid transparent}
#tabs button.on{border-bottom-color:var(--me)}
#grid{flex:1;overflow-y:auto;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:2px}
#grid button{font-size:34px;background:none;border:0;cursor:pointer;padding:3px 5px;line-height:1.1}
#grid.big button{font-size:64px;padding:4px 8px}
form{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
form input{flex:1;font-size:22px;padding:14px;border:1px solid var(--line);border-radius:22px;background:transparent;color:var(--ink);min-width:0}
form button{border:0;border-radius:50%;width:52px;height:52px;background:var(--me);color:#fff;font-size:22px;cursor:pointer;flex:none}
form button.s{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.err{color:#c0392b;font-size:16px}
</style>
</head>

// translation: Google (free endpoint) then MyMemory as fallback
async function translate(text, from, to){
  if(from === to) return text;
  const tl = to === "es" ? "es" : "ar";
  try{
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl="+from+"&tl="+tl+"&dt=t&q="+encodeURIComponent(text));
    const j = await r.json();
    return j[0].map(x=>x[0]).join("");
  }catch(e){
    try{
      const r = await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+from+"|"+to);
      const j = await r.json();
      return j.responseData.translatedText;
    }catch(e2){ return text; }
  }
}

async function gt(text, tl){
  const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+tl+"&dt=t&q="+encodeURIComponent(text));
  const j = await r.json();
  return {t: j[0].map(x=>x[0]).join(""), src: j[2]};
}
async function translateBoth(text){
  try{
    const [a, e] = await Promise.all([gt(text,"ar"), gt(text,"es")]);
    const src = (a.src === "ar" || a.src === "es") ? a.src : me.lang;
    const tr = {ar: a.t, es: e.t};
    tr[src] = text;
    return {lang: src, tr};
  }catch(err){
    const other = me.lang === "ar" ? "es" : "ar";
    const tr = {}; tr[me.lang] = text;
    tr[other] = await translate(text, me.lang, other);
    return {lang: me.lang, tr};
  }
}

function fmtTime(ts){

  return d.toLocaleDateString(loc,{day:"numeric",month:"short"}) + " " + t;

    if(s.val() === true){
      mine.onDisconnect().update({online:false, lastSeen:SV}).then(() => document.hidden ? setOff() : setOn());

  });

    const v = s.val() || {};
    const box = $("hRoom"); box.innerHTML = "";
    const others = Object.keys(v).filter(k => k !== key).map(k => v[k]);
    if(!others.length){ box.textContent = T[me.lang].wait; return; }
    others.forEach(o => {
      const row = document.createElement("div");
      const dot = document.createElement("span");
      dot.className = "dot" + (o.online ? " on" : "");
      row.appendChild(dot);
      row.appendChild(document.createTextNode(o.name + " · " + (o.online ? T[me.lang].on : (o.lastSeen ? T[me.lang].off + " " + fmtTime(o.lastSeen) : ""))));
      box.appendChild(row);
    });
  });
}

const cache = {}; const order = [];
function addMsg(id, m){
  if(!cache[id]) order.push(id);
  cache[id] = m;
  const mine = m.name === me.name;
  const d = document.createElement("div");
  d.className = "m" + (mine ? " me" : "") + ((m.sticker || m.img) ? " st" : "");
  let h = "";
  if(!mine) h += `<div class="who"></div>`;
  if(m.replyTo){
    const rt = m.replyTo;
    h += `<div class="q"></div>`;
  }
  h += `<div class="body"></div>`;
  d.innerHTML = h;
  if(!mine) d.querySelector(".who").textContent = m.name;
  if(m.replyTo){
    const rt = m.replyTo;
    d.querySelector(".q").textContent = rt.name + ": " + (rt.tr && rt.tr[me.lang] || rt.text);
  }
  const body = d.querySelector(".body");
  if(m.img){ const im = document.createElement("img"); im.src = IMG(m.img); im.alt = ""; body.appendChild(im); }
  else if(m.sticker){ body.textContent = m.sticker; }
  else{
    body.textContent = (m.tr && m.tr[me.lang]) || m.text;
    if(m.lang !== me.lang){
      const o = document.createElement("div");
      o.className = "orig"; o.textContent = m.text;
      d.appendChild(o);
    }
  }
  const b = document.createElement("button");
  b.className = "rp"; b.type = "button"; b.textContent = "↩";
  b.onclick = () => startReply(id);
  d.appendChild(b);
  d.ondblclick = () => startReply(id);
  const box = $("msgs");
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 150;
  box.appendChild(d);
  if(near || mine) box.scrollTop = box.scrollHeight;
}

function startReply(id){
  const m = cache[id]; if(!m) return;
  replyTo = {name:m.name, text: m.sticker || (m.img ? "🖼️" : m.text), tr: m.tr || null};
  $("replyTxt").textContent = T[me.lang].reply + " " + m.name + ": " + (m.sticker || (m.img ? "🖼️" : ((m.tr && m.tr[me.lang]) || m.text)));
  $("replyBar").style.display = "flex";
  $("txt").focus();
}
function clearReply(){ replyTo = null; $("replyBar").style.display = "none"; }
$("replyX").onclick = clearReply;

async function send(text, sticker, img){
  const base = {name: me.name, lang: me.lang, ts: firebase.database.ServerValue.TIMESTAMP};
  if(replyTo) base.replyTo = replyTo;
  if(img){ base.img = img; ref.push(base); clearReply(); return; }
  if(sticker){ base.sticker = sticker; ref.push(base); clearReply(); return; }
  const r = await translateBoth(text);
  base.lang = r.lang; base.text = text; base.tr = r.tr;
  ref.push(base);
  clearReply();
}

$("f").onsubmit = e => {
  e.preventDefault();
  const t = $("txt").value.trim();
  if(!t) return;
  $("txt").value = "";
  send(t);
};

$("stkBtn").onclick = () => {
  const s = $("stk"); s.style.display = s.style.display === "flex" ? "none" : "flex";
};

$("go").onclick = () => {
  const name = $("name").value.trim();
  const room = "main";
  const pick = document.querySelector("input[name=lang]:checked");
  if(!pick){ $("err").textContent = "اختار لغتك / Elige tu idioma"; return; }
  const lang = pick.value;
  if(!name){ $("err").textContent = "اكتب اسمك / Escribe tu nombre"; return; }
  if(!db){ $("err").textContent = "Firebase config missing"; return; }
  me = {name, lang, room};
  localStorage.setItem("chatme", JSON.stringify(me));
  enter();
};

$("lg").onclick = () => {
  me.lang = me.lang === "ar" ? "es" : "ar";
  localStorage.setItem("chatme", JSON.stringify(me));
  setUI(); clearReply();
  $("msgs").innerHTML = "";
  order.forEach(id => addMsg(id, cache[id]));
  $("msgs").scrollTop = $("msgs").scrollHeight;
};

$("out").onclick = () => {
  if(ref) ref.off();
  localStorage.removeItem("chatme");
  const off = me && me.setOff ? me.setOff() : Promise.resolve();
  Promise.race([off, new Promise(r => setTimeout(r, 800))]).then(() => location.reload());
};

try{
  const saved = JSON.parse(localStorage.getItem("chatme") || "null");
  if(saved && db){ me = saved; enter(); }
}catch(e){}
</script>
